# Blueprint do Render (plano gratuito). Em render.com: New > Blueprint > escolha este repositório.
services:
  - type: web
    name: morning-intelligence
    runtime: node
    plan: free
    rootDir: morning-intelligence
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: MI_TIMEZONE
        value: America/Sao_Paulo
      - key: MI_PASSWORD
        sync: false   # o Render pede o valor na criação; nunca fica no repositório
